<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#174d49">
    <title>PetPulse · Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f6f3ea; color: #214b42; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 430px; padding: 28px; border-radius: 20px; background: #fffdf7; }
      h1 { line-height: 1.2; }
      button { padding: 12px 18px; border: 0; border-radius: 10px; background: #286354; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión a internet</h1>
      <p>PetPulse necesita conexión para consultar y guardar tu información. Comprueba tu red e inténtalo de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>

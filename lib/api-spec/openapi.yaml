openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: PetPulse API contract
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Authenticated PetPulse account and onboarding operations
  - name: pets
    description: Owner-scoped pet profile operations
  - name: providers
    description: Provider-owned business profile operations
  - name: appointments
    description: Owner and provider appointment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the authenticated PetPulse profile
      description: Creates a basic owner profile on first authenticated access. The admin role is never self-assigned.
      responses:
        "200":
          description: Current account profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/onboarding:
    put:
      operationId: completeOnboarding
      tags: [account]
      summary: Complete first-time account setup
      description: Selects an owner or provider account type once. Admin access is provisioned separately by trusted configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Updated account profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "400":
          description: Invalid input or onboarding already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [account]
      summary: Get the current account's WhatsApp notification preferences
      responses:
        "200":
          description: Current WhatsApp phone and consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveNotificationPreferences
      tags: [account]
      summary: Save a separate phone number and explicit WhatsApp consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesInput"
      responses:
        "200":
          description: Saved WhatsApp notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          description: Invalid phone number or consent data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List the current owner's pets
      responses:
        "200":
          description: Pets owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PetProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet profile for the current owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: Created pet profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetProfile"
        "400":
          description: Invalid pet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pets/{petId}:
    patch:
      operationId: updatePet
      tags: [pets]
      summary: Update one of the current owner's pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetUpdate"
      responses:
        "200":
          description: Updated pet profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetProfile"
        "400":
          description: Invalid pet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pet not found for the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Delete one of the current owner's pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pet deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pet not found for the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pets/{petId}/photo:
    put:
      operationId: uploadPetPhoto
      tags: [pets]
      summary: Upload or replace a pet's private photo
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Pet profile with the uploaded photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetProfile"
        "400":
          description: Invalid image content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pet not found for the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Image exceeds the 5 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported image type or invalid image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The photo could not be uploaded or signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pets/{petId}/qr:
    post:
      operationId: createPetQr
      tags: [pets]
      summary: Create or retrieve the current owner's revocable pet QR token
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: QR token for the current owner's pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetQrResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pet not found for the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: revokePetQr
      tags: [pets]
      summary: Revoke a pet's public QR profile
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Public QR token revoked
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pet not found for the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /public/pets/{token}:
    get:
      operationId: getPublicPet
      tags: [pets]
      summary: Get the limited public profile associated with a QR token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
      responses:
        "200":
          description: Limited pet profile shared by its owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPetProfile"
        "404":
          description: QR profile unavailable or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /provider-profile:
    get:
      operationId: getProviderProfile
      tags: [providers]
      summary: Get the current provider's business profile
      responses:
        "200":
          description: Provider profile; null when not yet created
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ProviderProfile"
                  - type: "null"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveProviderProfile
      tags: [providers]
      summary: Create or update the current provider's business profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderProfileInput"
      responses:
        "200":
          description: Saved provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
        "400":
          description: Invalid provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /provider-profile/services:
    get:
      operationId: listProviderServices
      tags: [providers]
      summary: List the current provider's services
      responses:
        "200":
          description: Services owned by the current provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderServiceList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Provider business profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createProviderService
      tags: [providers]
      summary: Create a service for the current provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderServiceInput"
      responses:
        "201":
          description: Created provider service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderService"
        "400":
          description: Invalid service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Provider business profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /provider-profile/services/{serviceId}:
    patch:
      operationId: updateProviderService
      tags: [providers]
      summary: Update a service owned by the current provider
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderServiceUpdateInput"
      responses:
        "200":
          description: Updated provider service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderService"
        "400":
          description: Invalid service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: archiveProviderService
      tags: [providers]
      summary: Archive a service owned by the current provider
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Archived provider service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderService"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /provider-profile/availability:
    get:
      operationId: getProviderAvailability
      tags: [providers]
      summary: Get the current provider's weekly hours and date exceptions
      responses:
        "200":
          description: Provider availability configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAvailability"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Provider business profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveProviderAvailability
      tags: [providers]
      summary: Replace the current provider's weekly hours and date exceptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderAvailabilityInput"
      responses:
        "200":
          description: Saved provider availability configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAvailability"
        "400":
          description: Invalid availability configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Provider business profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments for the current owner or provider
      responses:
        "200":
          description: Appointments belonging to the current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner or provider role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: requestAppointment
      tags: [appointments]
      summary: Request an appointment with an approved provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentInput"
      responses:
        "201":
          description: Appointment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid or unavailable time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pet, provider or service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The provider is already booked for this period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /appointments/{appointmentId}/actions:
    post:
      operationId: actOnAppointment
      tags: [appointments]
      summary: Confirm, decline, cancel, or propose/respond to a reschedule
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentActionInput"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid action or state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a participant in this appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The proposed time is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /providers:
    get:
      operationId: listPublicProviders
      tags: [providers]
      summary: List approved providers in the public directory
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [veterinary, daycare, walker, shelter, store, other]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Approved provider profiles in the requested result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProviderPage"
        "400":
          description: Invalid search or pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [account]
      summary: Get account and provider moderation totals
      responses:
        "200":
          description: Administrative overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/providers:
    get:
      operationId: listAdminProviders
      tags: [providers]
      summary: List provider profiles for moderation
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, suspended]
      responses:
        "200":
          description: Provider profiles matching the requested status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/providers/{providerId}/approval:
    patch:
      operationId: updateProviderApproval
      tags: [providers]
      summary: Approve or suspend a provider profile
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderApprovalInput"
      responses:
        "200":
          description: Updated provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
        "400":
          description: Invalid approval status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Provider profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MeProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, provider, admin]
        onboardingCompleted:
          type: boolean
        providerStatus:
          type: string
          enum: [none, pending, approved, suspended]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - displayName
        - role
        - onboardingCompleted
        - providerStatus
